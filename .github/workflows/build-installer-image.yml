name: "Build RPi5 Installer Image"

on:
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  build-rpi5-image:
    runs-on: ubuntu-24.04-arm # GitHub's free ARM64 runner (public repos)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: DeterminateSystems/determinate-nix-action@131015bad844610e5e6300f8a143bf625d3e74f4 # v3.17.0

      - name: Configure Cachix substituter
        run: |
          sudo tee -a /etc/nix/nix.conf <<'EOF'
          extra-substituters = https://nixos-raspberrypi.cachix.org
          extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
          EOF
          sudo systemctl restart nix-daemon

      - name: Build installer image
        run: nix build .#installerImages.rpi5 --print-build-logs

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpi5-installer-image
          path: result/sd-image/*.img*
          compression-level: 0 # images are already compressed
